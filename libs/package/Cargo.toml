[package]
name = "oceans-package"
description = "Oceans app packages (.opk): manifest, permission catalog, Ed25519 signatures, verification without allocation (ADR-0046)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Building and signing packages (xtask, tests): needs an allocator.
build = []

[dependencies]
oceans-archive = { path = "../archive" }
ed25519-dalek = { version = "2.2.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[dev-dependencies]
oceans-package = { path = ".", features = ["build"] }
