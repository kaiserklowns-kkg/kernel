[package]
name = "core"
description = "Oceans Core: installs, verifies and runs apps with the permissions the user granted (ADR-0045 to ADR-0047)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "core"
test = false
bench = false

[dependencies]
oceans-rt = { workspace = true, features = ["alloc"] }
oceans-fs-proto.workspace = true
oceans-audio-proto.workspace = true
oceans-core-proto.workspace = true
oceans-package.workspace = true
# The packages the system image brings (ADR-0080).
oceans-archive.workspace = true
