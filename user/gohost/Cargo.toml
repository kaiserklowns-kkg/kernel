[package]
name = "gohost"
description = "The Oceans Go host: runs Go programs built for wasip1, giving them the Oceans System API over host functions (ADR-0050)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "gohost"
test = false
bench = false

[dependencies]
oceans-rt = { workspace = true, features = ["alloc"] }
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "validate", "libm", "prefer-btree-collections", "portable-dispatch"] }
