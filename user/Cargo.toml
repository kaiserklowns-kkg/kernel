# Userspace programs. A separate workspace: they build for the same bare-metal
# target as the kernel but with the normal (small) code model, set in
# user/.cargo/config.toml. Built by `cargo xtask`.
[workspace]
resolver = "3"
members = ["rt", "fs-proto", "block-proto", "init", "fs", "shell", "utils", "virtio-blk", "echo-service", "hello-client", "crasher", "ipc-test"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97"

[workspace.dependencies]
oceans-abi = { path = "../libs/abi" }
oceans-heap = { path = "../libs/heap" }
oceans-rt = { path = "rt" }
oceans-fs-proto = { path = "fs-proto" }
oceans-block-proto = { path = "block-proto" }
oceans-elf = { path = "../libs/elf" }

[profile.release]
# Programs are loaded through the filesystem (ADR-0019): keep them small.
# Symbols and section headers stay (the shell reads `.oceans.manifest`).
strip = "debuginfo"
