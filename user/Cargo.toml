# Userspace programs. A separate workspace: they build for the same bare-metal
# target as the kernel but with the normal (small) code model, set in
# user/.cargo/config.toml. Built by `cargo xtask`.
[workspace]
resolver = "3"
members = ["rt", "fs-proto", "init", "fs", "shell", "echo-service", "hello-client", "crasher", "ipc-test"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97"

[workspace.dependencies]
oceans-abi = { path = "../libs/abi" }
oceans-heap = { path = "../libs/heap" }
oceans-rt = { path = "rt" }
oceans-fs-proto = { path = "fs-proto" }

[profile.release]
debug = 1
