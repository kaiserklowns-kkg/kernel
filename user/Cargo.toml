# Userspace programs. A separate workspace: they build for the same bare-metal
# target as the kernel but with the normal (small) code model, set in
# user/.cargo/config.toml. Built by `cargo xtask`.
[workspace]
resolver = "3"
members = ["rt", "fs-proto", "core-proto", "block-proto", "net-proto", "input-proto", "virtio", "init", "fs", "shell", "utils", "virtio-blk", "nvme", "virtio-net", "e1000e", "xhci", "usb-storage", "usb-hid", "core", "apps/hello", "apps/heartbeat", "gohost", "net", "net-echo", "echo-service", "hello-client", "crasher", "ipc-test"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97"

[workspace.dependencies]
oceans-abi = { path = "../libs/abi" }
oceans-heap = { path = "../libs/heap" }
oceans-rt = { path = "rt" }
oceans-fs-proto = { path = "fs-proto" }
oceans-core-proto = { path = "core-proto" }
oceans-package = { path = "../libs/package" }
oceans-block-proto = { path = "block-proto" }
oceans-virtio = { path = "virtio" }
oceans-net-proto = { path = "net-proto" }
oceans-net = { path = "../libs/net" }
oceans-dns = { path = "../libs/dns" }
oceans-archive = { path = "../libs/archive" }
oceans-http = { path = "../libs/http" }
oceans-inet = { path = "../libs/inet" }
oceans-input = { path = "../libs/input" }
oceans-input-proto = { path = "input-proto" }
oceans-tls = { path = "../libs/tls" }
oceans-usb = { path = "../libs/usb" }
oceans-nvme = { path = "../libs/nvme" }
oceans-e1000e = { path = "../libs/e1000e" }
oceans-elf = { path = "../libs/elf" }
oceans-volume = { path = "../libs/volume" }
oceans-fat = { path = "../libs/fat" }

[profile.release]
# Programs are loaded through the filesystem (ADR-0019): keep them small.
# Symbols and section headers stay (the shell reads `.oceans.manifest`).
strip = "debuginfo"

# Debug builds too: debug info would make the boot archive many times
# larger (the TLS stack alone carries ~30 MiB of it), and nothing reads it.
[profile.dev]
strip = "debuginfo"

# Dependencies (crypto above all) are optimised even in debug builds: an
# unoptimised RSA or ECDSA verification takes seconds.
[profile.dev.package."*"]
opt-level = 2
