[package]
name = "oceans-rt"
description = "Minimal Oceans userspace runtime: entry point, syscalls, panic handling"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oceans-abi.workspace = true
oceans-heap = { workspace = true, optional = true }

[features]
# A global allocator (Vec, String, BTreeMap…) backed by memory objects.
alloc = ["dep:oceans-heap"]
