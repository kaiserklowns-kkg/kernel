[package]
name = "init"
description = "Oceans init and service manager (ADR-0016)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "init"
test = false
bench = false

[dependencies]
# The service table lives on the heap: it outgrew the 64 KiB stack.
oceans-rt = { workspace = true, features = ["alloc"] }
oceans-archive.workspace = true
oceans-fs-proto.workspace = true
