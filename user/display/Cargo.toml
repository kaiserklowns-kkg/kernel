[package]
name = "display"
description = "The Oceans display service: takes the framebuffer over, composes the desktop, routes the pointer, and shows permission dialogs (ADR-0057)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "display"
test = false
bench = false

[dependencies]
oceans-rt = { workspace = true, features = ["alloc"] }
oceans-core-proto.workspace = true
oceans-package.workspace = true
oceans-input-proto.workspace = true
oceans-window.workspace = true
oceans-search.workspace = true
oceans-account.workspace = true
# Shapes and interface text (ADR-0080), shared with apps.
oceans-draw.workspace = true
# The wallpaper photograph (ADR-0117), a PNG.
oceans-image.workspace = true
# The network, read only, for Control Center (ADR-0118).
oceans-net-proto.workspace = true
# Wi-Fi's panel (ADR-0130): the driver's files in /system/wifi.
oceans-fs-proto.workspace = true
oceans-wifi.workspace = true
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "bold", "size_16", "size_20", "unicode-basic-latin"] }
