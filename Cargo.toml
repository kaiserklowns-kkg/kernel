[workspace]
exclude = ["user"]
resolver = "3"
members = ["kernel", "libs/abi", "libs/acpi", "libs/archive", "libs/capability", "libs/elf", "libs/fat", "libs/frame-allocator", "libs/heap", "libs/http", "libs/inet", "libs/input", "libs/memory-map", "libs/pci", "libs/dns", "libs/e1000e", "libs/net", "libs/nvme", "libs/ahci", "libs/package", "libs/random", "libs/scheduler", "libs/tls", "libs/usb", "libs/volume", "libs/window", "libs/hardware", "tools/oceans", "tools/xtask"]
# The kernel only builds for bare-metal targets; host-side `cargo test`
# and `cargo build` cover the portable crates and tooling.
default-members = ["libs/abi", "libs/acpi", "libs/archive", "libs/capability", "libs/elf", "libs/fat", "libs/frame-allocator", "libs/heap", "libs/http", "libs/inet", "libs/input", "libs/memory-map", "libs/pci", "libs/dns", "libs/e1000e", "libs/net", "libs/nvme", "libs/ahci", "libs/package", "libs/random", "libs/scheduler", "libs/tls", "libs/usb", "libs/volume", "libs/window", "libs/hardware", "tools/oceans", "tools/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# License intentionally unset until the project license is decided (see docs/adr/0001).
publish = false
rust-version = "1.97"

[workspace.dependencies]
oceans-abi = { path = "libs/abi" }
oceans-acpi = { path = "libs/acpi" }
oceans-archive = { path = "libs/archive" }
oceans-capability = { path = "libs/capability" }
oceans-dns = { path = "libs/dns" }
oceans-e1000e = { path = "libs/e1000e" }
oceans-elf = { path = "libs/elf" }
oceans-fat = { path = "libs/fat" }
oceans-frame-allocator = { path = "libs/frame-allocator" }
oceans-heap = { path = "libs/heap" }
oceans-http = { path = "libs/http" }
oceans-inet = { path = "libs/inet" }
oceans-input = { path = "libs/input" }
oceans-memory-map = { path = "libs/memory-map" }
oceans-window = { path = "libs/window" }
oceans-hardware = { path = "libs/hardware" }
oceans-net = { path = "libs/net" }
oceans-nvme = { path = "libs/nvme" }
oceans-ahci = { path = "libs/ahci" }
oceans-package = { path = "libs/package" }
oceans-pci = { path = "libs/pci" }
oceans-random = { path = "libs/random" }
oceans-scheduler = { path = "libs/scheduler" }
oceans-tls = { path = "libs/tls" }
oceans-usb = { path = "libs/usb" }
oceans-volume = { path = "libs/volume" }

[profile.release]
debug = 1

# The FAT crash tests (ADR-0037) check thousands of simulated crash states;
# unoptimised they take most of an hour.
[profile.dev.package.oceans-fat]
opt-level = 2
