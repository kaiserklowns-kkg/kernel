[package]
name = "oceans-setup"
description = "Oceans Setup: installs Oceans from the web over a Windows PC, replacing Windows (ADR-0128)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "OceansSetup"
path = "src/main.rs"

[dependencies]
oceans-dev = { path = "../oceans" }
oceans-install.workspace = true
# Knowing the hardware before installing (ADR-0161): the table Oceans uses.
oceans-hardware.workspace = true
oceans-package.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(windows)'.dependencies.getrandom]
version = "0.2"
