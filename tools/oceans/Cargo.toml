[package]
name = "oceans-dev"
description = "The Oceans developer tool (ADR-0062): new projects from templates, developer keys, building and signing packages, serving them as a store"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "oceans"
path = "src/main.rs"

[dependencies]
oceans-archive.workspace = true
oceans-package = { workspace = true, features = ["build"] }
getrandom = "0.2"
sha2 = { version = "0.10.9", default-features = false }
