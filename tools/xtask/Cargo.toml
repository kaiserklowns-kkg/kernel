[package]
name = "oceans-xtask"
description = "Oceans build, image and emulator tooling (`cargo xtask`)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# In-tree crates (the volume crate mounts the guest's disk in the smoke
# test); oceans-package brings the RustCrypto Ed25519 and SHA-2 crates the
# TLS stack already uses, to sign example packages. The TLS stack itself
# (its `server` feature, with rustls's std I/O) serves the smoke test's
# https model server, and its roots go into the boot image as the Go
# services' trust store (ADR-0054): webpki-root-certs is the same Mozilla
# set as the webpki-roots it uses, as whole certificates, which Go needs.
[dependencies]
oceans-archive.workspace = true
oceans-package = { workspace = true, features = ["build"] }
# Release keys are `oceans keygen` key files (ADR-0072).
oceans-dev = { path = "../oceans" }
oceans-dns.workspace = true
oceans-fat.workspace = true
oceans-random.workspace = true
oceans-tls = { workspace = true, features = ["server"] }
oceans-volume.workspace = true
sha2 = { version = "0.10.9", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
webpki-root-certs = "1.0.9"

[dev-dependencies]
# The smoke test's picture is checked with the decoder that shows it (ADR-0090).
oceans-image.workspace = true
