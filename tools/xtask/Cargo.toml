[package]
name = "oceans-xtask"
description = "Oceans build, image and emulator tooling (`cargo xtask`)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# In-tree crates only (the volume crate mounts the guest's disk in the
# smoke test); oceans-package brings the RustCrypto Ed25519 and SHA-2
# crates the TLS stack already uses, to sign example packages.
[dependencies]
oceans-archive.workspace = true
oceans-package = { workspace = true, features = ["build"] }
oceans-dns.workspace = true
oceans-fat.workspace = true
oceans-volume.workspace = true
