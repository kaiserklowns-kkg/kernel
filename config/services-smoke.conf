# Smoke-test manifest (oceans.test=smoke): init checks every expect-* line
# once the non-`always` services have settled, and exits 0 only if all hold.

service echo
    image = echo-service
    restart = always
    grant = log
    provide = echo

service hello
    image = hello-client
    restart = never
    grant = log
    use = echo
    expect-exit = 0
    expect-runs = 1

# Faults on every run: must be restarted exactly twice, then given up.
service crasher
    image = crasher
    restart = on-failure
    max-restarts = 2
    grant = log
    expect-exit = -142
    expect-runs = 3

# Reads the line `cargo xtask smoke` types into the serial console.
service console-test
    image = console-test
    restart = never
    grant = log
    grant = console
    expect-exit = 0
    expect-runs = 1
