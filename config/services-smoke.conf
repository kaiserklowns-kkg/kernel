# Smoke-test manifest (oceans.test=smoke): init checks every expect-* line
# once the non-`always` services have settled, and exits 0 only if all hold.

service echo
    image = echo-service
    restart = always
    grant = log
    provide = echo

service hello
    image = hello-client
    restart = never
    grant = log
    use = echo
    expect-exit = 0
    expect-runs = 1

# Faults on every run: must be restarted exactly twice, then given up.
service crasher
    image = crasher
    restart = on-failure
    max-restarts = 2
    grant = log
    expect-exit = -142
    expect-runs = 3

# The disk driver (ADR-0021): one device, opened exclusively by init for
# it, the endpoint it serves and a log. `provide` comes first, so clients
# still get the endpoint when no disk is attached (they then see "block
# service unavailable").
service block
    image = virtio-blk
    restart = always
    grant = log
    provide = block
    grant = device:1af4:1042

# The network (ADR-0023): the virtio-net driver moves frames for exactly one
# device; the net service runs the IPv4 stack (DHCP) and hands out sockets.
service netdev
    image = virtio-net
    restart = always
    grant = log
    provide = netdev
    grant = device:1af4:1041

service net
    image = net
    restart = always
    grant = log
    provide = net
    use = netdev

# The filesystem on the test disk, publishing the test programs under /bin.
service fs
    image = fs
    restart = always
    grant = log
    provide = fs
    use = block
    grant = module:hello-client
    grant = module:crasher
    grant = module:ps
    grant = module:mem
    grant = module:uptime
    grant = module:uname
    grant = module:lspci
    grant = module:disk
    grant = module:ifconfig
    grant = module:ping
    grant = module:host
    grant = module:nc

# Echo on UDP and TCP port 7: xtask reaches it from the host through QEMU's
# port forwarding, proving packets and connections flow both ways.
service net-echo
    image = net-echo
    restart = always
    grant = log
    use = net

# The shell, driven by a script `cargo xtask smoke` types into the serial
# console; xtask checks its output, init checks it exits 0 (`exit`).
service shell
    image = shell
    restart = never
    grant = log
    grant = console
    use = echo
    use = fs
    use = net
    grant = sysinfo
    grant = devices
    expect-exit = 0
    expect-runs = 1
