# Smoke-test manifest (oceans.test=smoke): init checks every expect-* line
# once the non-`always` services have settled, and exits 0 only if all hold.

service echo
    image = echo-service
    restart = always
    grant = log
    provide = echo

service hello
    image = hello-client
    restart = never
    grant = log
    use = echo
    expect-exit = 0
    expect-runs = 1

# Faults on every run: must be restarted exactly twice, then given up.
service crasher
    image = crasher
    restart = on-failure
    max-restarts = 2
    grant = log
    expect-exit = -142
    expect-runs = 3

# The filesystem, publishing the test programs under /bin.
service fs
    image = fs
    restart = always
    grant = log
    provide = fs
    grant = module:hello-client
    grant = module:crasher
    grant = module:ps
    grant = module:mem
    grant = module:uptime
    grant = module:uname

# The shell, driven by a script `cargo xtask smoke` types into the serial
# console; xtask checks its output, init checks it exits 0 (`exit`).
service shell
    image = shell
    restart = never
    grant = log
    grant = console
    use = echo
    use = fs
    grant = sysinfo
    expect-exit = 0
    expect-runs = 1
