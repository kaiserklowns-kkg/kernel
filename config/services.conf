# Oceans system services, started by init in this order (ADR-0016).
#
# Each service receives exactly the capabilities listed, in this order:
#   grant = log      a log capability
#   grant = console  the system console (raw keyboard input and output)
#   provide = NAME   the server end of a new endpoint NAME
#   use = NAME       a client end of endpoint NAME (provided above)
# restart = always | on-failure | never; max-restarts = N (default 5).

service echo
    image = echo-service
    restart = always
    grant = log
    provide = echo

service hello
    image = hello-client
    restart = never
    grant = log
    use = echo
