# Oceans system services, started by init in this order (ADR-0016).
#
# Each service receives exactly the capabilities listed, in this order:
#   grant = log      a log capability
#   grant = console  the system console (raw keyboard input and output)
#   grant = module:NAME  a program image the service may run
#   grant = sysinfo  read-only system information (processes, memory, uptime)
#   grant = devices  the PCI device list (read-only)
#   grant = device:VVVV:DDDD  the PCI device with that vendor:device ID,
#                    opened exclusively for this service (its driver)
#   grant = device-class:CCSSPP  the first PCI device of that class,
#                    subclass and interface (standard controllers), likewise
#   grant = console-input  feeding the console's input only (keyboards)
#   provide = NAME   the server end of a new endpoint NAME
#   use = NAME       a client end of endpoint NAME (provided above)
#   use = NAME as ALIAS  the same, named ALIAS in the service's directory
# restart = always | on-failure | never; max-restarts = N (default 5).

service echo
    image = echo-service
    restart = always
    grant = log
    provide = echo

service hello
    image = hello-client
    restart = never
    grant = log
    use = echo

# The disk driver (ADR-0021): one device, opened exclusively by init for
# it, the endpoint it serves and a log. `provide` comes first, so clients
# still get the endpoint when no disk is attached (they then see "block
# service unavailable").
service block
    image = virtio-blk
    restart = always
    grant = log
    provide = block
    grant = device:1af4:1042

# The network (ADR-0023): the virtio-net driver moves frames for exactly one
# device; the net service runs the IPv4 stack (DHCP) and hands out sockets.
service netdev
    image = virtio-net
    restart = always
    grant = log
    provide = netdev
    grant = device:1af4:1041

# Intel 82574L Ethernet (ADR-0041): the same netdev protocol, for the same
# stack. Its device grant comes before `provide`: without that NIC, init
# cannot open the device, logs "cannot start e1000e" and registers
# nothing, so `netdev` stays virtio-net's. With it, its endpoint replaces
# virtio-net's (registered above, live or not), so the stack uses the
# Intel NIC whenever one is present.
service e1000e
    image = e1000e
    restart = always
    grant = log
    grant = device:8086:10d3
    provide = netdev

# USB (ADR-0032): the xHCI driver takes the first USB 3 host controller by
# its class, enumerates devices and types boot keyboards into the console;
# it may feed the console's input but neither read nor print to it.
service usb
    image = xhci
    restart = always
    grant = log
    provide = usb
    grant = device-class:0c0330
    grant = console-input

# USB mass storage (ADR-0034): a class driver with no device capability;
# xhci hands it a stick's interface and it serves the block protocol.
service usbstorage
    image = usb-storage
    restart = always
    grant = log
    use = usb
    provide = usbdisk

# USB mice and tablets (ADR-0042): a class driver with no device
# capability; xhci hands it pointers and it serves their events on `input`.
# Reading the pointer takes that endpoint (here only the shell has it).
service usbhid
    image = usb-hid
    restart = always
    grant = log
    use = usb
    provide = input

# The filesystem on a USB stick (ADR-0035): the fs service in removable
# media mode. The system filesystem shows it as /usb.
service usbfs
    image = fs
    restart = always
    grant = log
    provide = usbfs
    use = usbdisk as media

service net
    image = net
    restart = always
    grant = log
    provide = net
    use = netdev

# NVMe (ADR-0040): the driver takes the first NVMe controller by its class
# and serves its first namespace with the block protocol.
service nvme
    image = nvme
    restart = always
    grant = log
    provide = nvme
    grant = device-class:010802

# The filesystem on the NVMe disk: a second fs instance, which the system
# filesystem shows as /nvme.
service nvmefs
    image = fs
    restart = always
    grant = log
    provide = nvmefs
    use = nvme as block

# SATA (ADR-0069): the AHCI driver takes the first AHCI controller by its
# class and serves the first SATA disk on it with the block protocol.
# Without a disk it keeps running and answers every request with an I/O
# error.
service sata
    image = ahci
    restart = always
    grant = log
    provide = sata
    grant = device-class:010601

# The filesystem on the SATA disk, which the system filesystem shows as
# /sata. Like every fs instance it formats only a blank disk; a disk
# holding anything else is left untouched.
service satafs
    image = fs
    restart = always
    grant = log
    provide = satafs
    use = sata as block

# The filesystem, on the disk the block service drives (ADR-0022): the
# only holder of raw disk access. Program images granted here are published
# read-only under /bin (in memory: they come from the boot image).
service fs
    image = fs
    restart = always
    grant = log
    provide = fs
    use = block
    use = usbfs as mount:usb
    use = nvmefs as mount:nvme
    use = satafs as mount:sata
    grant = module:hello-client
    grant = module:ps
    grant = module:mem
    grant = module:uptime
    grant = module:uname
    grant = module:lspci
    grant = module:disk
    grant = module:ifconfig
    grant = module:ping
    grant = module:host
    grant = module:nc
    grant = module:fetch
    grant = module:date
    grant = module:lsusb
    grant = module:sysreport
    grant = module:diag
    grant = module:play
    grant = module:update
    grant = module:release
    grant = module:update.keys
    grant = module:apps
    grant = module:mouse

# Oceans Core (ADR-0045 to ADR-0047): installs signed packages, keeps the
# user's permission decisions and the audit log, and runs apps with
# exactly what they were allowed. It holds the filesystem root (for /apps,
# /system and /home) and what it may pass on to apps; the trusted
# publisher keys come with the boot image, and so does the Go host, which
# runs apps whose program is WebAssembly (ADR-0052).
service core
    image = core
    restart = always
    grant = log
    provide = core
    use = fs
    use = net
    use = input
    grant = sysinfo
    grant = module:trust.keys
    grant = module:gohost
    # The apps the system brings (ADR-0080), installed by Core.
    grant = module:calculator.opk
    grant = module:settings.opk
    grant = module:files.opk
    grant = module:activity.opk

# The desktop (ADR-0057): takes the screen over from the console, shows
# the launcher (apps from Core), the Terminal (the console's text) and
# permission dialogs; the pointer comes from the input service. Apps given
# `window` draw windows on it, and the keyboard goes to the focused one
# (`console-input`: keys for the Terminal go back to the console,
# ADR-0059). If it stops, the console takes the screen and keyboard back.
service display
    image = display
    restart = always
    grant = log
    grant = display
    grant = console-input
    use = core
    use = input
    grant = sysinfo

# Oceans AI (ADR-0051): the AI runtime, a Go service run by the Go host
# (ADR-0050). Its own authority: the network (for the model server) and
# read-only system information; agent sessions get what the requester
# delegates (a Core capability to query and run apps).
service ai
    image = gohost
    restart = always
    grant = log
    provide = ai
    use = net
    grant = sysinfo
    grant = module:ai.wasm
    grant = storage:/system/ai
    # The trusted roots for https model servers (ADR-0054), after the
    # program: the Go host runs the first module.
    grant = module:ca-roots.pem

# The Oceans web experience (ADR-0058): the bridge serves the web app and
# the System API as JSON on TCP port 8080. Its own authority: the network
# (to listen), read-only system information and the AI runtime. It holds
# no authority over apps until the shell pairs it (`ui pair`), and loses
# it again with `ui unpair`. The Store (ADR-0061): its own storage keeps
# downloads and the store's URL; https uses the system's root certificates.
service bridge
    image = gohost
    restart = always
    grant = log
    provide = bridge
    use = net
    use = ai
    grant = sysinfo
    grant = module:bridge.wasm
    grant = module:ca-roots.pem
    grant = storage:/system/bridge

# The interactive shell on the console, with the filesystem root. Programs
# it runs get only the authority typed (e.g. `run hello-client log use:echo`).
# Sound (ADR-0079): the first Intel HD Audio controller, its best output.
service audio
    image = hda
    restart = always
    grant = log
    provide = audio
    grant = device-class:040300

# The log, kept on disk across reboots (ADR-0074): /system/logs.
service logkeep
    image = logkeep
    restart = always
    grant = log
    grant = log-read
    use = fs

service shell
    image = shell
    restart = always
    grant = log
    grant = console
    # Diagnostics (ADR-0070): the shell may read the kept log.
    grant = log-read
    use = echo
    use = fs
    use = net
    use = usb
    use = usbdisk
    use = nvme
    use = sata
    use = audio
    use = core
    use = ai
    use = bridge
    use = input
    grant = sysinfo
    grant = devices
