name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      # Go services run on Oceans as wasip1 modules (ADR-0050).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The web experience is a SvelteKit app built by Bun (ADR-0058).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The reference FAT tools check what libs/fat writes (ADR-0037).
      - name: Install dosfstools and mtools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools
      - name: Check
        run: cargo xtask check

  qemu-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools
      - name: Install toolchain
        run: rustup show
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The web experience is a SvelteKit app built by Bun (ADR-0058).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Fetch Limine
        run: cargo xtask limine
      - name: Boot smoke test
        run: cargo xtask smoke
